# R-side env for seismicGWAS on the Windows laptop.
#
# Isolated from the Python `uc-cross-atlas` env per the same discipline as
# the LDSC Py2.7 env: R deps live alongside the main Python env, not inside
# it, so a botched R/bioconductor solve can't break the scoring path.
#
# The full scripts/environment.yml fails on Windows (bioconductor + plink +
# htslib are bioconda-Linux-only). This subset keeps just the R packages
# seismicGWAS needs: SingleCellExperiment (the AnnData equivalent),
# EmpiricalBrownsMethod (used by 07_regime2_meta but cheap to include),
# tidyverse, plus the install_r_deps.R script's GitHub-installed
# seismicGWAS + scOntoMatch dependencies (remotes, devtools).
#
# Bioconductor bits on bioconda may or may not have Windows builds; if a
# conflict surfaces, fall back to letting BiocManager install them at
# Rscript time inside R rather than at conda solve time.
name: uc-cross-atlas-r
channels:
  - conda-forge
  - bioconda
dependencies:
  - r-base>=4.3
  - r-essentials
  - r-devtools
  - r-remotes
  - r-tidyverse
  - r-biocmanager
  - r-arrow      # feather IO, matches Python side
  - bioconductor-singlecellexperiment
  - bioconductor-empiricalbrownsmethod
  - bioconductor-zellkonverter
  - r-ontologyindex
